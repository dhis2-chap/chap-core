git:
  filters:
    - filter_type: file
      file_format: PO
      source_language: en
      source_file: chap_core/locales/en.pot
      translation_files_expression: 'chap_core/locales/<lang>.po'
  settings:
    language_mapping:
      fa_AF: prs
      uz@Cyrl: uz_UZ_Cyrl
      uz@Latn: uz_UZ_Latn
