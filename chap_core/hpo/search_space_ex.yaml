# Example CHAP HPO search space.
# Supported parameter specifications:
#   - values: categorical choices
#   - int: integer range
#   - float: continuous or stepped floating-point range

learning_rate:
  type: float
  low: 0.0001
  high: 0.01
  log: True
batch_size:
  values: [16, 32, 64, 128]
max_epochs:
  type: int
  low: 20
  high: 100
  step: 10
dropout_rate:
  type: float
  low: 0.0
  high: 0.5
  step: 0.05
hidden_size:
  type: int
  low: 16
  high: 128
  step: 16
context_length:
  values: [6, 12, 24, 36]