# Example chap-server.yml. chap-core reads it when CHAP_CONFIG holds its path.
#
# Keys are the setting names without the CHAP_ prefix, in lower case. An environment
# variable overrides the same setting here (CHAP_CORS_ORIGINS overrides cors_origins).
# An unknown key stops chap-core at startup, so a typo is caught at once.
#
# Keep secrets such as CHAP_API_TOKEN in the environment, not in this file.

# Browser origins allowed by CORS. Not needed when the Modeling App connects through
# the DHIS2 Route API.
cors_origins:
  - https://dhis2.example.org

# Path prefix when serving behind a reverse proxy.
# root_path: /chap

# Turn on debug logging.
# debug: false

# The single API token (the older way). Set it in the environment, not here:
#   CHAP_API_TOKEN=$(openssl rand -hex 32)
# It acts as an admin token with the id legacy, sent as `Authorization: Bearer <token>`,
# `Authorization: ApiToken <token>` (DHIS2 routes) or `X-Service-Key: <token>`. It works
# alone or beside the named tokens below, so clients can move to their own token one at a
# time. A named token may not use the id legacy or the same secret.

# Named tokens, one per client. Each secret lives in the environment variable token_env
# names, never in this file: make one with `openssl rand -hex 32`. Tiers are viewer,
# analyst and admin, or one defined under tiers. With no tokens and no
# CHAP_API_TOKEN, authentication is off. See docs/contributor/auth_contract.md.
# authentication:
#   tiers:
#     forecaster:
#       includes: [viewer]
#       permissions: [run:backtests, run:predictions]
#   tokens:
#     - id: modeling-app-read
#       token_env: CHAP_TOKEN_MODELING_APP_READ
#       tier: viewer
#     - id: modeling-app
#       token_env: CHAP_TOKEN_MODELING_APP
#       tier: analyst
#     - id: notebook
#       token_env: CHAP_TOKEN_NOTEBOOK
#       tier: forecaster
