{{- if and (not .Values.valkey.enabled) (not .Values.externalValkey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chap.fullname" . }}-valkey
  labels:
    {{- include "chap.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.externalValkey.secretKeys.password }}: {{ required "Set externalValkey.password or externalValkey.existingSecret" .Values.externalValkey.password | quote }}
{{- end }}
