{{- if .Values.dhis2.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chap.fullname" . }}-dhis2-register-{{ .Release.Revision }}
  labels:
    {{- include "chap.labels" . | nindent 4 }}
    {{- with .Values.dhis2.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ttlSecondsAfterFinished: {{ .Values.dhis2.registerJob.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.dhis2.registerJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "chap.labels" . | nindent 8 }}
        {{- with .Values.dhis2.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure-route
          image: curlimages/curl:8.11.1
          envFrom:
            - secretRef:
                name: {{ include "chap.fullname" . }}-dhis2
          env:
            - name: CHAP_URL
              value: "http://{{ include "chap.fullname" . }}-api.{{ .Release.Namespace }}.svc:{{ .Values.api.service.port }}"
          command:
            - /bin/sh
            - -c
            - |
              PAYLOAD=$(printf '%s' '{
                "name": "Chap Modeling App",
                "code": "chap",
                "url": "'"${CHAP_URL}"'/**",
                "authorities": ["F_CHAP_MODELING_APP"],
                "headers": {"Content-Type": "application/json"},
                "responseTimeoutSeconds": 30
              }')
              RESPONSE=$(curl -s -w "\n%{http_code}" \
                -X POST \
                -H "Content-Type: application/json" \
                -u "${username}:${password}" \
                --connect-timeout 10 \
                --max-time 30 \
                --data "$PAYLOAD" \
                "https://${hostname}/api/{{ .Values.dhis2.apiVersion }}/routes")
              HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -1)
              BODY=$(printf '%s' "$RESPONSE" | head -n -1)
              echo "POST https://${hostname}/api/{{ .Values.dhis2.apiVersion }}/routes -> HTTP $HTTP_CODE: $BODY"
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                echo "Route registered: HTTP $HTTP_CODE"
                exit 0
              elif [ "$HTTP_CODE" = "409" ]; then
                echo "Route already exists (HTTP 409), nothing to do"
                exit 0
              fi
              exit 1
{{- end }}
