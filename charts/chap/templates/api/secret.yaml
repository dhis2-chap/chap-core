{{- if and .Values.apiToken.token (not .Values.apiToken.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chap.fullname" . }}-api-token
  labels:
    {{- include "chap.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiToken.secretKeys.token }}: {{ .Values.apiToken.token | quote }}
{{- end }}
