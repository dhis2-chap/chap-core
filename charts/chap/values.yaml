# Default values for the CHAP chart.

global:
  # -- Labels applied to all resources and pods of every CHAP component (api, worker, db).
  # The bundled valkey subchart does not read global values, so set valkey.commonLabels as well.
  # Labels that differ per component belong in api.labels, worker.labels and db.labels.
  commonLabels: {}

nameOverride: ""
fullnameOverride: ""

api:
  enabled: true
  image:
    repository: ghcr.io/dhis2-chap/chap-core
    pullPolicy: IfNotPresent
    # -- Defaults to the chart appVersion.
    tag: ""
  imagePullSecrets: []
  replicaCount: 1
  command:
    - gunicorn
    - -c
    - gunicorn.conf.py
    - -k
    - uvicorn.workers.UvicornWorker
    - chap_core.rest_api.app:app
    - --bind
    - 0.0.0.0:8000
  resources: {}
  volumeMounts: []
  podAnnotations: {}
  # -- Labels applied to the api resources and pods, on top of global.commonLabels.
  labels: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    readOnlyRootFilesystem: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

worker:
  enabled: true
  image:
    repository: ghcr.io/dhis2-chap/chap-worker
    pullPolicy: IfNotPresent
    # -- Defaults to the chart appVersion.
    tag: ""
  imagePullSecrets: []
  replicaCount: 1
  command:
    - celery
    - -A
    - chap_core.rest_api.celery_tasks
    - worker
    - --loglevel=info
  resources: {}
  volumeMounts: []
  podAnnotations: {}
  # -- Labels applied to the worker resources and pods, on top of global.commonLabels.
  labels: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    readOnlyRootFilesystem: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  livenessProbe:
    exec:
      command:
        - celery
        - -A
        - chap_core.rest_api.celery_tasks
        - inspect
        - ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    exec:
      command:
        - celery
        - -A
        - chap_core.rest_api.celery_tasks
        - inspect
        - ping
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

# PostgreSQL provisioned via the CloudNativePG operator (must be installed on the cluster).
# Disable and configure externalDatabase to use an existing PostgreSQL server instead.
db:
  enabled: true
  # -- Labels applied to the Cluster resource and, via CNPG inheritedMetadata, to everything the
  # operator creates from it, on top of global.commonLabels.
  labels: {}
  # -- Labels applied via CNPG inheritedMetadata to all objects the operator creates (pods, PVCs, ...).
  podLabels: {}
  # -- Superuser password. Required unless existingSecret is set.
  password: ""
  # -- Existing secret with `username` and `password` keys, used as the CNPG superuser secret.
  existingSecret: ""
  database: chap_core
  instances: 1
  storageSize: 10Gi
  version: "17"
  imageName: ""
  enableSuperuserAccess: true
  pooler:
    enabled: false
  monitoring:
    enabled: false

# External PostgreSQL connection, used when db.enabled is false.
externalDatabase:
  host: ""
  port: 5432
  database: chap_core
  username: postgres
  # -- Password for the external database. Ignored when existingSecret is set.
  password: ""
  # -- Existing secret with the external database credentials.
  existingSecret: ""
  secretKeys:
    username: username
    password: password

# Valkey subchart, see https://github.com/valkey-io/valkey-helm for all options.
# Disable and configure externalValkey to use an existing Valkey/Redis server instead.
valkey:
  enabled: true
  auth:
    enabled: true
    aclUsers:
      # -- The default user requires a `password`, unless auth.usersExistingSecret is set.
      default:
        permissions: "~* &* +@all"
  dataStorage:
    enabled: true
    requestedSize: 10Gi
  # -- Set to the same labels as global.commonLabels; the valkey subchart does not read global values.
  commonLabels: {}

# External Valkey/Redis connection, used when valkey.enabled is false.
externalValkey:
  host: ""
  port: 6379
  # -- Password for the external Valkey. Ignored when existingSecret is set.
  password: ""
  # -- Existing secret with the external Valkey password.
  existingSecret: ""
  secretKeys:
    password: password

# Register CHAP as a route in a DHIS2 instance after install/upgrade.
dhis2:
  enabled: false
  hostname: ""
  apiVersion: "42"
  username: "system"
  # -- Required when dhis2.enabled is true.
  password: ""
  # -- Labels applied to the registration job and its pod, on top of global.commonLabels. The job is
  # the only evidence that registration happened, so a label is what lets something track it.
  labels: {}
  registerJob:
    backoffLimit: 10
    # -- How long the finished job is kept. It is the record of whether registration succeeded, so it
    # outlives the run by a day rather than the hour a job is usually worth keeping.
    ttlSecondsAfterFinished: 86400
