apiVersion: skaffold/v4beta13
kind: Config
build:
  local:
    useBuildkit: true
  artifacts:
    - image: ghcr.io/dhis2-chap/chap-core
      docker:
        dockerfile: Dockerfile
    - image: ghcr.io/dhis2-chap/chap-worker
      docker:
        dockerfile: Dockerfile.worker
deploy:
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true
  helm:
    releases:
      - name: chap
        chartPath: charts/chap
        namespace: chap
        createNamespace: true
        setValueTemplates:
          api.image.pullPolicy: Always
          worker.image.pullPolicy: Always
          db.password: "{{.CHAP_DB_PASSWORD}}"
          valkey.auth.aclUsers.default.password: "{{.REDIS_PASSWORD}}"
