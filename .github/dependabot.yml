version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v19 was published with a broken bundle (missing @actions/core) and the
      # release was pulled, but the floating tag still resolves. Stay on v18.
      - dependency-name: "gabrielfalcao/pyenv-action"
        versions: ["19"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # 0.0.44 types table-model constructors and 0.0.45 switches datetimes to UTC,
      # which needs code changes and a Postgres migration (CLIM-1245).
      - dependency-name: "sqlmodel"
        versions: [">=0.0.44"]
