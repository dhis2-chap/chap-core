name: Weekly codebase review

# A deep review of the whole repository once a week, in the night before
# Friday, posted as a GitHub issue labelled "weekly-review". Each run reads the
# previous report so findings can be tracked as new, persisting or resolved.
# Run it by hand from the Actions tab (workflow_dispatch) to test it.
on:
  schedule:
    # 02:17 UTC is 04:17 Oslo time in summer and 03:17 in winter. Off the full
    # hour because GitHub delays scheduled runs that start on the hour.
    - cron: "17 2 * * 5"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect previous report and changes since it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label weekly-review --author "app/github-actions" \
            --search "sort:created-desc" --state all --limit 1 \
            --json body,createdAt > previous.json
          jq -r '.[0].body // "No previous report."' previous.json > previous-report.md
          # Review changes since the previous report, so a failed or skipped
          # week is not lost, but never more than 30 days back.
          since=$(jq -r '.[0].createdAt // empty' previous.json)
          if [ -z "$since" ] || [ "$(date -d "$since" +%s)" -lt "$(date -d '30 days ago' +%s)" ]; then
            since=$(date -d '7 days ago' --iso-8601=seconds)
          fi
          echo "Reviewing changes since $since"
          {
            echo "# Commits merged since $since"
            echo
            git log --since="$since" --no-merges --format='%h %s' -- . ':!docs'
            echo
            echo "# Files changed since $since"
            echo
            base=$(git rev-list -1 --before="$since" HEAD)
            [ -n "$base" ] || base=$(git rev-list --max-parents=0 HEAD)
            git diff --stat "$base" HEAD
          } > week-changes.md
          wc -l previous-report.md week-changes.md

      - name: Map git authors to GitHub logins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Git author emails do not map cleanly to GitHub logins, so collect
          # the mapping from the commits API. Only people with a commit in the
          # last 90 days are listed, so actions are not tagged to people who
          # have left.
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits?since=$(date -d '12 months ago' --iso-8601=seconds)&per_page=100" \
            --jq '.[] | select(.author.login != null) | [.author.login, .commit.author.name, .commit.author.email, .commit.author.date] | @tsv' \
            > commit-authors.tsv
          python3 - <<'PY' > team.md
          import collections, datetime
          cutoff = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=90)).isoformat()
          authors, active = collections.defaultdict(set), set()
          for line in open("commit-authors.tsv"):
              login, name, email, date = line.rstrip("\n").split("\t")
              if login.endswith("[bot]"):
                  continue
              authors[login].add(f"{name} <{email}>")
              if date >= cutoff:
                  active.add(login)
          print("# Active team members: GitHub login and git author identities\n")
          for login in sorted(active):
              print(f"- {login}: {', '.join(sorted(authors[login]))}")
          PY
          cat team.md

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are doing the weekly deep review of the chap-core repository.
            Pull requests here are mostly written by AI coding agents and get a
            fast first-pass review, so your job is to catch what accumulates
            between those reviews: bugs and structural problems that no single
            PR review would see.

            Start by reading CLAUDE.md, docs/contributor/code_overview.md and
            the "Weekly codebase review" section of docs/contributor/pr_review.md,
            which lists deliberate design choices you must not report as
            findings. Then read previous-report.md (last week's report, or
            "No previous report.") and week-changes.md (commits and files
            changed since that report, or in the last 7 days).
            team.md lists the active team members with their GitHub login and
            the git author names and emails they commit under.

            Review in this order and spend most of your effort on the first two:
            1. Code changed since the previous report, read with its surrounding code:
               bugs, incorrect edge-case handling, silently swallowed errors,
               weakened or disabled tests, redundant tests, and changes to public
               interfaces (REST API, CLI, model template and plugin interface,
               database models and migrations, DHIS2 integration) that look
               unintended.
            2. Every finding in last week's report: check whether it is still
               present, fixed, or no longer relevant.
            3. The rest of chap_core/ for accumulated problems: duplicated logic,
               dead code, inconsistent or leaky interfaces, missing tests on
               critical paths, fragile error handling, and drift from the
               architecture described in the contributor docs.

            Do not report formatting, naming, docstrings or style. Ruff runs in
            CI. Do not report anything listed as a deliberate choice in the docs.
            Do not praise.

            Write the report to review-report.md in exactly this structure:

            # Weekly codebase review
            ## Suggested next actions
            At most five, each concrete and small enough for one PR, each
            ending with "Owner: @login" and a few words on why.
            ## Summary
            Three to five sentences on the state of the codebase and this week's
            most important point.
            ## New findings
            ## Persisting findings
            Findings from last week that are still present, one line each.
            ## Resolved since last week

            Order findings by impact. Each finding is a short paragraph that
            names the file and line range, states the failure scenario or cost
            in one or two sentences, and says how sure you are.

            When the findings are written, find an owner for each next action:
            the team member best placed to fix it because they wrote or changed
            the code involved. Use git blame on the lines in question, git log
            on the files and functions (including git log -L), and git show on
            the commits, whose messages carry the PR number, to see who introduced the
            behaviour and who has since worked on that code or closely related
            code. Weigh recent and substantial changes over old or trivial
            ones such as renames, formatting or dependency bumps. Map git
            authors to logins with team.md, never tag a login that is not
            listed there, and write "Owner: unassigned" if no listed member has
            worked on the code. Spread actions across people when more than one
            fits. The reason after the owner names the change that makes them
            the owner, for example "wrote the target column threading in #702".
            Do not tag anyone outside the next actions. Keep the whole
            report under 1500 words. Write the report file and nothing else; do
            not modify any other file and do not create branches or comments.
          claude_args: |
            --model claude-fable-5-1
            --max-turns 120
            --disallowedTools "Agent,Task,Skill"
            --allowedTools "Write,Bash(git log:*),Bash(git blame:*),Bash(git show:*)"

      - name: Open issue with the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s review-report.md ]; then
            echo "::error::Claude did not write review-report.md"
            exit 1
          fi
          gh label create weekly-review --color d93f0b --force \
            --description "Automatic weekly codebase review reports"
          gh issue create \
            --title "Weekly codebase review $(date +%F)" \
            --body-file review-report.md \
            --label weekly-review

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weekly-review-${{ github.run_id }}
          path: review-report.md
          if-no-files-found: ignore
