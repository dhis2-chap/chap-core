name: Release Charts

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'dhis2-chap/chap-core'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1

      - name: Helm Dependencies
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update
          helm dep update charts/chap

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          config: cr.yaml
          # The action passes this input as --mark-as-latest, which overrides
          # cr.yaml, and it defaults to true.
          mark_as_latest: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
