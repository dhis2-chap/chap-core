name: Release Charts

on:
  push:
    branches:
      - master

jobs:
  release:
    if: github.repository == 'dhis2-chap/chap-core'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.1.1

      - name: Helm Dependencies
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update
          helm dep update charts/chap

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.8.0
        with:
          config: cr.yaml
          # The action passes this input as --mark-as-latest, which overrides
          # cr.yaml, and it defaults to true.
          mark_as_latest: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
