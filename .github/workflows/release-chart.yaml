name: Release Charts

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'dhis2-chap/chap-core'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1

      - name: Helm Dependencies
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update
          helm dep update charts/chap

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          config: cr.yaml
          # The action passes this input as --mark-as-latest, which overrides
          # cr.yaml, and it defaults to true.
          mark_as_latest: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # chart-releaser repackages a changed chart even when its version already
      # has a release, and then skips the upload. Only sign packages that are
      # the exact bytes attached to their release in this run.
      - name: Find newly released charts
        id: released
        run: |
          mkdir -p to-sign
          for pkg in .cr-release-packages/*.tgz; do
            [[ -e "$pkg" ]] || continue
            name=$(basename "$pkg" .tgz)
            gh release download "$name" --pattern "$name.tgz" --dir remote --clobber
            if cmp -s "$pkg" "remote/$name.tgz"; then
              cp "$pkg" to-sign/
            fi
          done
          if compgen -G "to-sign/*.tgz" > /dev/null; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate artifact attestation
        id: attest
        if: steps.released.outputs.any == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: to-sign/*.tgz

      - name: Attach attestation to releases
        if: steps.released.outputs.any == 'true'
        run: |
          for pkg in to-sign/*.tgz; do
            name=$(basename "$pkg" .tgz)
            cp "$BUNDLE" "$name.tgz.sigstore.json"
            gh release upload "$name" "$name.tgz.sigstore.json" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
