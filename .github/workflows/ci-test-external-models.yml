# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test-all (docker, external models, etc)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the PR so the expensive job below can be skipped or reduced.
  # On push events every output is true so master always gets the full run.
  # The job names below are required checks in the master ruleset, so gating
  # happens on the steps: a workflow-level paths filter, or a job-level `if` on
  # a matrix job, leaves the required check pending and blocks the merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      tests: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            # predicate-quantifier applies to every filter, so a filter that should
            # match any of several paths must be written as one union pattern.
            docs:
              - '{docs/**,mkdocs.yml}'
            code:
              - '**'
              - '!docs/**'
              - '!mkdocs.yml'
              - '!README.md'
              - '!AGENTS.md'
              - '!LICENSE'
              - '!.github/CODEOWNERS'
              - '!.github/dependabot.yml'
              - '!.github/**/*.md'
              - '!.claude/**'

  test-all:
    needs: changes
    env:
      REDIS_HOST: localhost

    runs-on: ubuntu-latest
    services:
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    #container:
    #    image: ubuntu:latest
    #    options: --user root
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v3

      #- name: Log in to GitHub Container Registry
      #  uses: docker/login-action@v3
      #  with:
      #    registry: ghcr.io
      #    username: ${{ github.actor }}
      #    password: ${{ secrets.GITHUB_TOKEN }}

      #- name: Pull worker image from cache
      #  run: |
      #    docker pull ghcr.io/dhis2-chap/chap-worker-with-inla@sha256:634bb3e61e66f9c1c2d499c495d294cd5f287078ae7b54629114066f8ec75aab

      # - name: Free Disk Space (Ubuntu)
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     # this might remove tools that are actually needed,
      #     # when set to "true" but frees about 6 GB
      #     tool-cache: false
      #
      #     # all of these default to true, but feel free to set to
      #     # "false" if necessary for your workflow
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: false
      #     swap-storage: true
      - name: Install uv
        if: needs.changes.outputs.tests == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python ${{ matrix.python-version }}
        if: needs.changes.outputs.tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev liblzma-dev
          uv python install ${{ matrix.python-version }}
      - name: Install the project
        if: needs.changes.outputs.tests == 'true'
        run: uv sync --dev
      - name: Install pyenv
        if: needs.changes.outputs.tests == 'true'
        uses: gabrielfalcao/pyenv-action@a1fc55906be92612782934c70e3985b940bd0165 # v18
        with:
          default: "3.13"
          command: ""
      # Dockerfile.worker builds on ghcr.io/dhis2-chap/chap-worker-with-inla, which is
      # private, so the build needs a login; the workflow token has packages: read.
      - name: Log in to GitHub Container Registry
        if: needs.changes.outputs.code == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run full suite
        if: needs.changes.outputs.code == 'true'
        run: |
          cp .env.example .env
          make test-all
      - name: Run slow documentation tests
        if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.code != 'true'
        run: make test-docs-slow
