name: Create and publish chap Docker image

on:
  push:
    branches: ["dev", "master"]
    tags: ["v1.*", "v2.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/sha) to build"
        required: true
      tag:
        description: "Docker image tag to publish"
        required: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.repository == 'dhis2-chap/chap-core'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image_name: dhis2-chap/chap-core
          # - dockerfile: Dockerfile.inla
          #   image_name: dhis2-chap/chap-core-with-inla
          - dockerfile: Dockerfile.worker
            image_name: dhis2-chap/chap-worker

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker image tag
        id: tag
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.image_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAGS="$IMAGE:${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            TAGS="$IMAGE:dev"
          elif [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            TAGS="$IMAGE:master"
          else
            git fetch origin master --depth=1
            TAG_COMMIT=$(git rev-parse "$GITHUB_REF^{}")
            git merge-base --is-ancestor "$TAG_COMMIT" origin/master \
              || { echo "Tag does not point to master"; exit 1; }
            TAG="${GITHUB_REF#refs/tags/}"
            TAGS="$IMAGE:$TAG"
            # Only the newest final release (vX.Y.Z) moves latest
            NEWEST=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
              | sed 's#.*refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [[ "$TAG" == "$NEWEST" ]]; then
              TAGS="$TAGS,$IMAGE:latest"
            fi
          fi
          echo "TAGS=$TAGS" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and push Docker image (amd64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.TAGS }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_name }}:buildcache,mode=max
          build-args: |
            GIT_REVISION=${{ github.sha }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
