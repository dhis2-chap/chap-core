name: Create and publish chap Docker image

on:
  push:
    branches: ["dev", "master"]
    tags: ["v1.*", "v2.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/sha) to build"
        required: true
      tag:
        description: "Docker image tag to publish"
        required: true

env:
  REGISTRY: ghcr.io

# prepare works out the tags (and rejects a version tag outside master) before
# anything is pushed. Each platform is then built natively on its own runner
# and pushed by digest only. The merge job combines the digests of each image
# into one multi-arch image under those tags, and attests it. Merge runs per
# image, so a failed chap-core build does not hold back the worker.
jobs:
  prepare:
    if: github.repository == 'dhis2-chap/chap-core'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tag.outputs.TAGS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Determine Docker image tags
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAGS="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            TAGS="dev"
          elif [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            TAGS="master"
          else
            git fetch origin master --depth=1
            TAG_COMMIT=$(git rev-parse "$GITHUB_REF^{}")
            git merge-base --is-ancestor "$TAG_COMMIT" origin/master \
              || { echo "Tag does not point to master"; exit 1; }
            TAG="${GITHUB_REF#refs/tags/}"
            TAGS="$TAG"
            # Only the newest final release (vX.Y.Z) moves latest
            NEWEST=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
              | sed 's#.*refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [[ "$TAG" == "$NEWEST" ]]; then
              TAGS="$TAGS,latest"
            fi
          fi
          echo "TAGS=$TAGS" >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chap-core
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - name: chap-core
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # The worker base image (chap-worker-with-inla) is amd64 only.
          - name: chap-worker
            dockerfile: Dockerfile.worker
            platform: linux/amd64
            runner: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform slug
        id: platform
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/dhis2-chap/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/dhis2-chap/${{ matrix.name }}:buildcache-${{ steps.platform.outputs.slug }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/dhis2-chap/${{ matrix.name }}:buildcache-${{ steps.platform.outputs.slug }},mode=max
          build-args: |
            GIT_REVISION=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.name }}-${{ steps.platform.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Run even when some build legs failed; each image checks below that all
    # of its own platforms were built.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chap-core
            platforms: 2
          - name: chap-worker
            platforms: 1

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image and push tags
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [[ "$count" -ne "$EXPECTED" ]]; then
            echo "::error::Expected $EXPECTED platform builds of $IMAGE, found $count; not publishing it."
            exit 1
          fi
          tag_args=()
          IFS=',' read -ra tags <<< "$TAGS"
          for t in "${tags[@]}"; do tag_args+=(-t "$IMAGE:$t"); done
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:${tags[0]}"
        env:
          IMAGE: ${{ env.REGISTRY }}/dhis2-chap/${{ matrix.name }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          EXPECTED: ${{ matrix.platforms }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/dhis2-chap/${{ matrix.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
